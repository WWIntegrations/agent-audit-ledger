[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit-ledger"
version = "1.0.0"
description = "A bounded local audit chain, independent checkpoints, and real SQLite replay"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ledger-audit = "ledger_audit.__main__:main"

[tool.setuptools]
packages = ["ledger_audit"]
