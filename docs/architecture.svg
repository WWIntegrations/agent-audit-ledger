<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 248" width="992" height="248" role="img" aria-labelledby="t d">
<title id="t">Replay state and verify a preserved prefix</title><desc id="d">Events append atomically to a local SQLite ledger. Verification checks the chain and an independently preserved checkpoint digest. Replay creates a separate SQL projection without rerunning agents or external effects.</desc>
<style>:root{--tlo:#DCEEFF;--tekst:#000000;--linia:#315F8D;--strefa:#315F8D;--wezel:#FFFFFF;--wezel-tekst:#000000;--akcent:#00518F;}text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:var(--tekst)}.n{font-size:13px;font-weight:600;fill:var(--wezel-tekst)}.p{font-size:11px;fill:var(--wezel-tekst)}.s{font-size:12px;fill:var(--strefa)}.tt{font-size:16px;font-weight:700}.wz{fill:var(--wezel);stroke:var(--linia);stroke-width:1.5}.bram{stroke:var(--akcent);stroke-width:3}.mod{stroke-dasharray:0}.st{fill:none;stroke:var(--strefa);stroke-width:1.5;stroke-dasharray:6 4}.kr{stroke:var(--linia);stroke-width:1.5;fill:none}.gr{stroke:var(--akcent);stroke-width:2.5}.gt{fill:var(--akcent)}</style>
<rect width="992" height="248" fill="#DCEEFF"/>
<text class="tt" x="40" y="32">Replay state and verify a preserved prefix</text>
<g><rect class="st" x="16" y="72" width="464" height="160" rx="6"/><text class="s" x="26" y="88">Bounded local event history</text></g>
<g><rect class="st" x="512" y="72" width="464" height="160" rx="6"/><text class="s" x="522" y="88">Check the prefix and derive state</text></g>
<path class="kr" d="M208 152H280"/><path class="gt" d="M288 152l-9 -5v10z"/>
<path class="kr" d="M456 152H528"/><path class="gt" d="M536 152l-9 -5v10z"/>
<path class="gr" d="M496 102V202"/>
<path class="kr" d="M704 152H776"/><path class="gt" d="M784 152l-9 -5v10z"/>
<g data-id="event" data-typ="klient"><rect class="wz" x="40" y="116" width="168" height="72" rx="8"/>
<text class="n" x="124" y="144" text-anchor="middle">Event</text>
<text class="p" x="124" y="178" text-anchor="middle">Explicit event ID</text></g>
<g data-id="ledger" data-typ="usluga"><rect class="wz" x="288" y="116" width="168" height="72" rx="8"/>
<text class="n" x="372" y="144" text-anchor="middle">Ledger</text>
<text class="p" x="372" y="178" text-anchor="middle">Atomic SQLite append</text></g>
<g data-id="verify" data-typ="bramka"><rect class="wz bram" x="536" y="116" width="168" height="72" rx="8"/>
<text class="n" x="620" y="144" text-anchor="middle">Verify</text>
<text class="p" x="620" y="178" text-anchor="middle">Independent digest</text></g>
<g data-id="replay" data-typ="usluga"><rect class="wz" x="784" y="116" width="168" height="72" rx="8"/>
<text class="n" x="868" y="144" text-anchor="middle">Replay</text>
<text class="p" x="868" y="178" text-anchor="middle">New SQL projection</text></g>
</svg>