<g data-id="push" data-typ="klient"><rect class="wz" x="40" y="116" width="168" height="72" rx="8"/>
<text class="n" x="124" y="144" text-anchor="middle">Push or pull request</text>
<text class="p" x="124" y="178" text-anchor="middle">checks.yml</text></g>
<g data-id="contracts" data-typ="bramka"><rect class="wz bram" x="288" y="116" width="168" height="72" rx="8"/>
