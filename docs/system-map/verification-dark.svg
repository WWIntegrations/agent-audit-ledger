<text class="p" x="372" y="178" text-anchor="middle">unittest, demo, 2 Pythons</text></g>
<g data-id="interface" data-typ="bramka"><rect class="wz bram" x="536" y="116" width="168" height="72" rx="8"/>
<text class="n" x="620" y="144" text-anchor="middle">interface job</text>
<text class="p" x="620" y="178" text-anchor="middle">node tests, rebuild, diff</text></g>
<g data-id="recorded" data-typ="bramka"><rect class="wz bram" x="784" y="116" width="168" height="72" rx="8"/>
